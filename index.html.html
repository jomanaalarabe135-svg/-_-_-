<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة إلى طيبة</title>
<style>
:root{--bg:#f6f0e4;--card:#fffdf8;--g:#5b6b3f;--gd:#44512e;--line:#e3d6bb;--tx:#3b3a33;--ok:#e9f0d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d201a;--card:#272b22;--g:#9db07a;--gd:#2f3a1f;--line:#3d4333;--tx:#ece8dc;--ok:#33402a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;min-height:100vh;padding-bottom:40px}
header{background:var(--gd);color:#fff;text-align:center;padding:26px 18px;border-radius:0 0 26px 26px}
header h1{margin:0 0 6px;font-size:24px}header p{margin:0;font-size:14px;opacity:.85}
.bar{max-width:420px;margin:14px auto 0;background:rgba(255,255,255,.2);height:9px;border-radius:9px}
.bar i{display:block;height:100%;background:#f3e3b5;border-radius:9px;width:0;transition:width .5s}
main{max-width:460px;margin:18px auto;padding:0 14px}
.msg{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px;margin-bottom:14px;text-align:center}
.msg small{color:var(--g);display:block;margin-bottom:6px}.msg b{font-size:20px;line-height:1.9;color:var(--g)}
.final{background:var(--gd);color:#fff;border:0}.final b{color:#fff;font-size:22px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.card.done{border-color:var(--g)}
.hd{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:none;border:0;color:var(--g);font:inherit;font-weight:700;cursor:pointer}
.bd{display:none;padding:4px 15px 15px;border-top:1px solid var(--line)}.card.open .bd{display:block}
.bd p{margin:10px 0}
input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);margin-bottom:8px}
.row{display:flex;gap:8px}
.btn{flex:1;background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{background:none;border:1px solid var(--line);color:var(--g);border-radius:12px;padding:0 14px;font:inherit;cursor:pointer}
.err{color:#c0392b;font-size:14px;margin:0 0 8px;min-height:0}
.piece{background:var(--ok);border-radius:12px;padding:12px;text-align:center;font-weight:700;color:var(--g);font-size:18px}
.h{font-size:13px;opacity:.75;text-align:center;margin-top:8px}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 300 92" width="250" aria-hidden="true" style="display:block;margin:0 auto 8px"><g fill="#f3e3b5"><rect x="70" y="30" width="8" height="58"/><path d="M68 30h12l-6-14z"/><rect x="222" y="30" width="8" height="58"/><path d="M220 30h12l-6-14z"/><rect x="100" y="62" width="100" height="26"/><rect x="148" y="20" width="4" height="12"/></g><path d="M120 62a30 30 0 0 1 60 0z" fill="#8fb36a"/><g stroke="#8fb36a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M30 88V56M270 88V56"/><path d="M30 56q-13-3-19 7M30 56q13-3 19 7M30 56q-5-12-13-14M30 56q5-12 13-14"/><path d="M270 56q-13-3-19 7M270 56q13-3 19 7M270 56q-5-12-13-14M270 56q5-12 13-14"/></g><path d="M4 88h292" stroke="#f3e3b5" stroke-width="2"/></svg>
<h1>رحلة إلى طيبة</h1>
<p>أسئلة عن المدينة المنورة… أجيبي واجمعي قطع الرسالة</p>
<div class="bar"><i id="pb"></i></div>
</header>
<main>
<div id="msg" class="msg" style="display:none"></div>
<div id="list"></div>
</main>
<script>
var D=[
{q:"ما الاسم القديم للمدينة المنورة قبل الهجرة؟",h:"تبدأ بحرف الياء",p:"اللهم حبّب",k:["يثرب"]},
{q:"ما أول مسجد بُني في الإسلام؟",h:"يقع في جنوب المدينة",p:"إلينا",k:["قبا"]},
{q:"من الصحابي الذي نزل النبي ﷺ في بيته عند وصوله المدينة؟",h:"أنصاري، كنيته أبو…",p:"المدينة",k:["ايوب"]},
{q:"ما الجبل الذي قال عنه النبي ﷺ: «يحبنا ونحبه»؟",h:"جبل غزوة مشهورة في المدينة",p:"كحبّنا مكة",k:["احد"]},
{q:"ما المسجد الذي بناه النبي ﷺ بعد وصوله المدينة، وفيه الروضة الشريفة؟",h:"المسجد…",p:"أو أشدّ",k:["نبوي"]}
];
var KEY="risala-madina-v1",S={done:{},note:""},open=1,wrong={};
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function norm(s){return(s||"").replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[إأآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ء/g,"").replace(/[^\u0621-\u064A ]/g,"").replace(/\s+/g," ").trim()}
function ok(d,v){var n=norm(v);if(!n)return false;return d.k.some(function(k){return n.indexOf(norm(k))>-1})}
function cnt(){return D.filter(function(_,i){return S.done[i+1]}).length}
function render(){
var c=cnt(),all=c===D.length,fin=!!S.done[6],h="";
document.getElementById("pb").style.width=(c/D.length*100)+"%";
var m=document.getElementById("msg");
if(fin){m.style.display="block";m.className="msg final";m.innerHTML="<small style='color:#f3e3b5'>🎁 اكتملت الرسالة</small><b>"+D.map(function(d){return d.p}).join(" ")+"</b><div class='h' style='color:#f3e3b5'>«اللهم حبّب إلينا المدينة كحبّنا مكة أو أشدّ» – رواه البخاري ومسلم</div>"}
else if(c>0){m.style.display="block";m.className="msg";m.innerHTML="<small>✨ رسالتك حتى الآن</small><b>"+D.filter(function(_,i){return S.done[i+1]}).map(function(d){return d.p}).join(" ")+"</b>"}
else m.style.display="none";
D.forEach(function(d,i){var n=i+1,dn=!!S.done[n];
h+="<div class='card"+(dn?" done":"")+(open===n?" open":"")+"'><button class='hd' onclick='tg("+n+")'><span>"+(dn?"✅":"🔒")+" اليوم "+n+"</span>"+(dn?"<span>« "+d.p+" »</span>":"")+"</button><div class='bd'><p>"+d.q+"</p>";
if(dn)h+="<div class='piece'>🎁 "+d.p+"</div>";
else h+="<input id='i"+n+"' placeholder='اكتبي إجابتك هنا…' onkeydown=\"if(event.key==='Enter')sb("+n+")\"><div class='err' id='e"+n+"'>"+(wrong[n]?"حاولي مرة أخرى 🌱":"")+"</div><div class='row'><button class='btn' onclick='sb("+n+")'>إرسال</button><button class='hint' onclick=\"document.getElementById('t"+n+"').style.display='block'\">؟</button></div><div class='h' id='t"+n+"' style='display:none'>"+d.h+"</div>";
h+="</div></div>"});
h+="<div class='card"+(fin?" done":"")+(open===6?" open":"")+"'><button class='hd' onclick='tg(6)'><span>"+(fin?"✅":"🔒")+" اليوم 6</span></button><div class='bd'><p>🌟 مهمة تدبر: اكتبي في سطرين ماذا تحبين في المدينة المنورة؟ ثم اجمعي جميع القطع.</p>";
if(!all)h+="<div class='h'>أكملي الأيام 1 إلى 5 أولًا ("+c+"/5)</div>";
if(fin)h+="<div class='piece'>اجمعي جميع القطع 🎁</div>";
else h+="<textarea id='nt' rows='3' placeholder='اكتبي هنا…'"+(all?"":" disabled")+">"+(S.note||"")+"</textarea><button class='btn' style='width:100%'"+(all?"":" disabled")+" onclick='fn()'>اجمعي الرسالة</button>";
h+="</div></div>";
document.getElementById("list").innerHTML=h}
function tg(n){open=open===n?0:n;render()}
function sb(n){var v=document.getElementById("i"+n).value;
if(ok(D[n-1],v)){S.done[n]=true;wrong[n]=false;save();open=n+1;render()}
else{wrong[n]=true;render();document.getElementById("i"+n).value=v;setTimeout(function(){wrong[n]=false;var e=document.getElementById("e"+n);if(e)e.textContent=""},1600)}}
function fn(){var v=document.getElementById("nt").value;if(!v.trim())return;S.note=v;S.done[6]=true;save();open=0;render()}
render();
</script>
</body>
</html>
